# Runs CardHawk's Profit Hunter full sweep once an hour (free GitHub Actions).
# Quick "new listings only" runs happen every 10 minutes in between (hunt-quick.yml).
# Uses the same CRON_SECRET repository secret as the 3-hourly scan.
name: CardHawk Profit Hunter

on:
  schedule:
    - cron: "37 * * * *" # hourly at :37 (UTC) — away from the 3-hourly scan at :17
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

jobs:
  hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Trigger Profit Hunter
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://cardscout-ai.vercel.app/api/cron/scan?source=github&only=hunter")
          cat response.json
          echo
          test "$status" = "200"
